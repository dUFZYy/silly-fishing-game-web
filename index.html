lfisch:"Hatchetfish",Blobfisch:"Blobfish","Tiefsee-Qualle":"Deep-sea jelly",Riesenassel:"Giant isopod",Fangzahnfisch:"Fangtooth",Viperfisch:"Viperfish",Gespensterfisch:"Barreleye",Pelikanaal:"Gulper eel","Schwarzer Drachenfisch":"Black dragonfish",Seeteufel:"Sea devil",Vampirtintenfisch:"Vampire squid",Koboldhai:"Goblin shark",Riesenkalmar:"Giant squid",Taucherstiefel:"Diver's boot",Stint:"Smelt",Lodde:"Capelin",Polardorsch:"Polar cod","Gefrorener Fisch":"Frozen fish",Kabeljau:"Atlantic cod",Seesaibling:"Arctic char",Seeskorpion:"Sea scorpion",Eisfisch:"Icefish","Arktischer Lachs":"Arctic salmon",Seewolf:"Wolffish","Königskrabbe":"King crab",Heilbutt:"Halibut","Verirrter Pinguin":"Lost penguin","Grönlandhai":"Greenland shark","Der alte Karl":"Old Karl","Der Kraken":"The Kraken",Megalodon:"Megalodon",Leviathan:"Leviathan","Der Eiskönig":"The Ice King"}),Object.assign(c.dict,{"Tippen, um weiterzumachen":"Tap to continue",verscheucht:"spooks them","Willkommen. Das ist dein Zimmer":"Welcome. This is your room","Oben das Regal, in der Mitte dein Becken. Es ist noch leer. Dagegen hilft ein Fisch.":"The shelf up top, your tank in the middle. It's still empty. A fish would fix that.","Tipp auf ANGELN.":"Tap FISH.","Daneben, nicht drauf":"Beside them, not on them","Der Köder lockt alles im großen Kreis. Mitten in den Schwarm geworfen, scheucht er ihn auseinander. Der kleine Kreis ist tabu.":"The bait draws in everything inside the big circle. Cast into the middle of the shoal and you scatter it. The small circle is off limits.","Tipp ins Wasser, knapp neben die Fische.":"Tap the water, just beside the fish.","Jetzt liegt er. Nichts tun":"It's down. Do nothing","Der Köder muss liegen bleiben, bis einer anbeißt. Wer jetzt ins Wasser tippt, holt ihn wieder ein. Finger weg, bis das „!“ kommt.":"The bait has to stay put until something bites. Tap the water now and you reel it straight back in. Hands off until the “!” shows up.","Beim „!“ zugreifen. Der Finger bleibt drauf. Dann holst du sofort ein, ein zweites Tippen braucht es nicht.":"Grab it at the “!”. Keep your finger down. You start reeling right away, no second tap needed.","Jetzt tippen und halten.":"Tap and hold now.","Halten, und bei Rot loslassen":"Hold, and let go on red","Halten holt ein und spannt die Schnur. Zieht der Fisch, blinkt alles rot. Dann kurz loslassen, sonst reißt sie.":"Holding reels in and tightens the line. When the fish pulls, everything flashes red. Let go for a moment or the line snaps.","Bei Rot geht der Finger hoch":"On red the finger comes up","Er flüchtet. Solange es rot blinkt, spannt Halten die Schnur doppelt so schnell. Lass los, bis das Rot weg ist, dann hältst du weiter.":"He's bolting. While it flashes red, holding tightens the line twice as fast. Let go until the red is gone, then hold again.","Der Fang steht jetzt im Buch":"Your catch is in the book","Jede Art wandert in den Fischdex, mit Rekordgewicht. Und jeder Ort hat andere Arten. Was hier schwimmt, gibt es woanders nicht.":"Every species goes into the Fishdex, with its record weight. And every spot has different species. What swims here swims nowhere else.","Oben rechts geht es nach Hause. Dein Becken steht dort, der Fischdex auch.":"Top right takes you home. That's where your tank is, and the Fishdex.","Tipp auf „Menü“.":"Tap “Menu”.","Deine Fische leben hier":"Your fish live here","Jede neue Art zieht ins Becken. Sechs Plätze sind frei, weitere kosten Coins. Die Bewohner werfen Münzen ab, auch wenn du nicht spielst.":"Every new species moves into the tank. Six slots come free, more of them cost coins. The residents drop coins even while you're not playing.","Tipp auf das Becken.":"Tap the tank.","Ein Geschenk: der Findling":"A gift: the boulder","Er gehört dir, ohne Coins. Auf jeden der sechs Plätze kommt ein Stück Deko. Platz antippen, dann in der Liste auf „Aufstellen“.":"It's yours, no coins. Each of the six slots holds one piece of decor. Tap a slot, then pick “Place” in the list.","Tipp auf einen freien Platz.":"Tap an empty slot.","Die Kiste füllt sich von selbst":"The chest fills itself","Deine Bewohner zahlen Eintritt, auch wenn das Spiel zu ist. Die Kiste sammelt, bis du sie antippst. Ist sie voll, läuft nichts mehr nach.":"Your residents pay admission even while the game is closed. The chest keeps collecting until you tap it. Once it's full, nothing more comes in.","Tipp auf die Kiste.":"Tap the chest.","Hier liegt das Buch":"The book lives here","Im Regal stehen alle Arten dieses Orts und deine Rekorde. Was noch fehlt, steht als „???“ drin. Oben lässt sich der Ort umschalten.":"The shelf holds every species of this spot and your records. Whatever is still missing sits there as “???”. Switch spots at the top.","Tipp auf das Buch.":"Tap the book.","Ab Stufe 3 gibt es Platz zwei":"Level 3 opens the second spot","Unten durchwischen. Jeder Ort hat eigene Fische, eine eigene Stufe und einen Preis, den du nur einmal zahlst. Zurück kannst du jederzeit.":"Swipe along the bottom. Every spot has its own fish, its own level and a price you pay only once. You can go back any time.","Genug für die zweite Rute":"Enough for the second rod","Jede Rute vergrößert den großen Kreis von vorhin, und nachbessern lässt sie sich zehnmal. Köder machen den Biss schneller und Seltenes wahrscheinlicher.":"Every rod widens that big circle from earlier, and each one can be upgraded ten times. Bait speeds up the bite and makes rare fish likelier.","Sieh dir den Kreis an":"Look at the circle","Das ist deine neue Reichweite. Der rote Kreis bleibt gleich groß. Je besser die Rute, desto mehr Wasser liegt zwischen „lockt“ und „verscheucht“.":"That's your new range. The red circle stays the same size. The better the rod, the more water sits between “draws” and “spooks”.","Aufträge, Pass, Erfolge":"Quests, pass, achievements","Hinter dem Brett liegen Tagesbonus, Aufträge und der Angel-Pass. Da gibt es Coins und Ausrüstung, ohne dass du dafür angeln musst. Die Erfolge stehen unter „Angler“.":"Behind the board sit the daily bonus, the quests and the Angler Pass. Coins and gear are waiting there, no fishing required. Achievements are under “Angler”.","Die Uhr angelt mit":"The clock fishes too","Ein Tag vergeht in fünf Minuten. Nachts beißen andere Fische. Regen macht sie hungrig, und in der goldenen Stunde kommt Seltenes hoch.":"A day passes in five minutes. Different fish bite at night. Rain makes them hungry, and the golden hour brings up the rare ones.","Ab jetzt gibt es das Echolot":"The sonar is available now","Im Regal, unter Ausrüstung. Ein Ping zeigt, wo die Fische stehen. Im trüben Wasser sieht man das sonst nicht.":"On the shelf, under Gear. One ping shows where the fish are. In murky water you'd never see them otherwise.","Ein Ping, und du siehst sie":"One ping and you see them","Das Gerät zeigt ein paar Sekunden lang alle Fische in Reichweite. Was dir im Fischdex noch fehlt, bekommt einen goldenen Ring.":"For a few seconds the device shows every fish in range. Whatever is still missing from your Fishdex gets a gold ring.","Tipp auf das Gerät.":"Tap the device.","Der Fischfinder färbt mit":"The fish finder adds colour","Die Punkte tragen jetzt die Seltenheitsfarbe aus dem Fischdex. Für einen violetten lohnt sich die Fahrt quer über den See. Die Pause ist kürzer, das Nachleuchten hält länger.":"The dots now carry the rarity colour from the Fishdex. A purple one is worth the trip across the lake. The cooldown is shorter too, and the afterglow lasts longer.","Das Tiefenradar nennt Namen":"The depth radar names names","Es erfasst den ganzen Schirm, schreibt fehlende Arten aus und setzt Pfeile an den Rand für das, was noch außerhalb schwimmt.":"It sweeps the whole screen, spells out the missing species and puts arrows on the edge for whatever swims off-screen.","Das da ist ein Boss":"That one is a boss","Er kommt erst, wenn du hier alles andere gefangen hast, und er beißt zuverlässig. Der Drill läuft anders. Bei jeder Flucht tippst du auf die GEGENSEITE. Wer ihn holt, bekommt den nächsten Ort geschenkt.":"He only turns up once you've caught everything else here, and he bites reliably. The fight works differently. On every burst, tap the OPPOSITE side. Land him and the next spot is free.","Das Wasser hört am Rand nicht auf":"The water doesn't end at the edge","Fische schwimmen von außerhalb des Bildes herein, und du kannst zu ihnen hinausschießen. Wer nur zielt, was er sieht, übersieht die Hälfte.":"Fish swim in from off-screen, and you can shoot out to them. Aim only at what you can see and you miss half of it.","Halten spannt, der Bogen sagt wie weit":"Hold to charge, the arc shows how far","Halte irgendwo im Wasser. Der Bogen zeigt, wie weit der Speer kommt. Wird der Rahmen um den Fisch grün, sitzt der Schuss. Bei Orange hältst du länger, bis der Balken die Marke erreicht.":"Hold anywhere in the water. The arc shows how far the spear reaches. When the frame around the fish turns green, the shot lands. On orange, hold longer until the bar reaches the mark.","Hier verdient das Tiefenradar sein Geld":"This is where the depth radar pays","Unten sieht man kaum etwas. Ein Ping erfasst den ganzen Schirm und setzt Pfeile für das, was außerhalb schwimmt. Liegt ein Punkt hinter dem Reichweitenbogen, musst du erst näher heran.":"You can barely see a thing down here. One ping sweeps the whole screen and puts arrows on what swims off-screen. If a dot lies beyond the range arc, get closer first.","Tippen zum Überspringen  ▸▸":"Tap to skip  ▸▸","KAPITEL 1":"CHAPTER 1","KAPITEL 2":"CHAPTER 2","KAPITEL 3":"CHAPTER 3","KAPITEL 4":"CHAPTER 4","KAPITEL 5":"CHAPTER 5","KAPITEL 6":"CHAPTER 6","Der See":"The Lake","Die Seemitte":"Mid-Lake","Die Küste":"The Coast","Das Riff":"The Reef","Die Tiefsee":"The Deep Sea","Die Arktis":"The Arctic","Ohne Sonne":"No Sun","Ein Loch im Eis":"A Hole in the Ice",Steinmole:"Stone Jetty","Abend am Steg.":"Evening at the pier.","Wie jeden Abend.":"Like every evening.","Das Wasser steht
